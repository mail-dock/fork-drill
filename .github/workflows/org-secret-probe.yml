# TASK-0412 live proof: does the mail-dock Organization secret ORG_PROBE reach this repository's job?
# Prints only whether it is set and a short hash, never the value.
name: org-secret-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: apex-2core
    steps:
      - env:
          V: ${{ secrets.ORG_PROBE }}
        run: |
          if [ -n "$V" ]; then echo "ORG_PROBE reaches ${{ github.repository }}: set, sha256 $(printf %s "$V" | sha256sum | cut -c1-8)"; else echo "ORG_PROBE reaches ${{ github.repository }}: NOT set"; fi
