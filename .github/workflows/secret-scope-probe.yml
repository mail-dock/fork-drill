# BUG-0112's live proof: does this repository's job receive the org-scoped secret PACKAGES_READ_TOKEN?
# Prints only "set" or "unset" — never the value, and never its length. Dispatch-only; safe to delete afterwards.
name: secret-scope-probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the org secret reached this job
        env:
          PROBE: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          if [ -n "$PROBE" ]; then echo "PACKAGES_READ_TOKEN: set"; else echo "PACKAGES_READ_TOKEN: unset"; fi
          echo "repository: $GITHUB_REPOSITORY"
